<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5f0">
  <title>{% block title %}{{ t('brand') }}{% endblock %}</title>
  <script src="/static/theme.js?v=0.2.13"></script>
  <link rel="stylesheet" href="/static/style.css?v=0.2.13">
  <script src="/static/app.js?v=0.2.13" defer></script>
</head>
<body>
  <div class="shell {% block shell_class %}{% endblock %}">
    <header class="header">
      <a class="brand" href="/" aria-label="{{ t('brand') }}">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>{{ t('brand') }}</span>
      </a>
      <div class="header-actions">
        {% if request.session.get("authenticated") %}
        <nav class="primary-nav" aria-label="{{ t('navigation') }}">
          <a href="/">{{ t('tracker') }}</a>
          <a href="/planner/week">{{ t('week') }}</a>
        </nav>
        {% if request.url.path == "/planner/week" %}
        <a class="settings-gear" href="/planner/settings?week={{ monday }}" id="calendar-settings-button" title="{{ t('calendar_settings') }}" aria-label="{{ t('calendar_settings') }}">⚙</a>
        {% endif %}
        {% endif %}
        <button type="button" class="theme-toggle" id="theme-toggle"
          data-dark-label="{{ t('enable_dark_mode') }}"
          data-light-label="{{ t('enable_light_mode') }}"
          aria-label="{{ t('enable_dark_mode') }}" aria-pressed="false"
          title="{{ t('enable_dark_mode') }}">
          <span class="theme-icon-moon" aria-hidden="true">☾</span>
          <span class="theme-icon-sun" aria-hidden="true">☀</span>
        </button>
        <form class="lang-form" action="/language" method="post" aria-label="{{ t('language') }}">
          <input type="hidden" name="token" value="{{ csrf }}">
          <input type="hidden" name="return_to" value="{{ request.url.path }}">
          <button type="submit" name="lang" value="en" class="{{ 'active-lang' if lang == 'en' else '' }}" aria-pressed="{{ 'true' if lang == 'en' else 'false' }}">EN</button>
          <span aria-hidden="true">/</span>
          <button type="submit" name="lang" value="nl" class="{{ 'active-lang' if lang == 'nl' else '' }}" aria-pressed="{{ 'true' if lang == 'nl' else 'false' }}">NL</button>
        </form>
        {% if request.session.get("authenticated") %}
        <form action="/logout" method="post">
          <input type="hidden" name="token" value="{{ csrf }}">
          <button class="button-link" type="submit">{{ t('logout') }}</button>
        </form>
        {% endif %}
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
